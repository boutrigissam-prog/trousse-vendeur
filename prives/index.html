<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maquettes privées</title>
<style>
:root{--fond:#f6f4ef;--encre:#161616;--ligne:#e3e0d8;--accent:#1f4d3a}
*{box-sizing:border-box;margin:0}
body{background:var(--fond);color:var(--encre);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px 48px}
main{max-width:460px;margin:0 auto}
h1{font-size:30px;line-height:1.15;margin-bottom:8px}
p.aide{color:#55524c;margin-bottom:20px}
form{display:grid;gap:12px}
input{height:52px;border:1.5px solid #c9c4ba;border-radius:12px;padding:0 14px;font:inherit;background:#fff}
button{min-height:52px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 17px system-ui,sans-serif;cursor:pointer}
button.second{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.erreur{color:#a3261b;font-weight:600;min-height:1.5em}
.liste{display:grid;gap:10px;margin-top:8px}
.liste button{text-align:left;padding:14px 16px}
.liste small{display:block;font-weight:500;opacity:.8}
.ecrans img{display:block;width:100%;height:auto}
.barre{position:sticky;top:0;background:var(--fond);padding:10px 0;display:flex;gap:10px;align-items:center;z-index:2}
.barre b{font-size:16px;line-height:1.2}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="porte">
    <h1>Maquettes privées</h1>
    <p class="aide">Réservé à l'équipe. Entre le mot de passe reçu.</p>
    <form id="formulaire">
      <input id="mdp" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe" required>
      <button type="submit" id="ouvrir">Ouvrir</button>
      <p class="erreur" id="erreur" role="alert"></p>
    </form>
  </section>

  <section id="choix" hidden>
    <h1>Maquettes</h1>
    <p class="aide">Propositions non publiées. À montrer en personne seulement.</p>
    <div class="liste" id="liste"></div>
  </section>

  <section id="vue" hidden>
    <div class="barre"><button class="second" id="retour" type="button" style="min-height:44px;padding:0 14px">← Liste</button><b id="titre"></b></div>
    <div class="ecrans" id="ecrans"></div>
  </section>
</main>
<script>
// Même format que outils/chiffrer-maquettes.py : sel(16) + iv(12) + AES-GCM, PBKDF2-SHA256 600 000 tours.
const $ = id => document.getElementById(id);
let motDePasse = '';

async function ouvrirFichier(nom) {
  const reponse = await fetch(nom, { cache: 'no-store' });
  if (!reponse.ok) throw new Error('fichier');
  const blob = new Uint8Array(await reponse.arrayBuffer());
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(motDePasse), 'PBKDF2', false, ['deriveKey']);
  const cle = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: blob.slice(0, 16), iterations: 600000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const clair = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(16, 28) }, cle, blob.slice(28));
  return JSON.parse(new TextDecoder().decode(clair));
}

function montrer(section) {
  ['porte', 'choix', 'vue'].forEach(id => { $(id).hidden = id !== section; });
  window.scrollTo(0, 0);
}

$('formulaire').addEventListener('submit', async e => {
  e.preventDefault();
  motDePasse = $('mdp').value;
  $('erreur').textContent = '';
  $('ouvrir').disabled = true;
  $('ouvrir').textContent = 'Ouverture…';
  try {
    const liste = await ouvrirFichier('liste.bin');
    $('liste').replaceChildren(...liste.map(m => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span></span><small></small>';
      b.firstChild.textContent = m.nom;
      b.lastChild.textContent = m.ecrans + ' écrans';
      b.addEventListener('click', () => afficher(m, b));
      return b;
    }));
    try { sessionStorage.setItem('mdp-maquettes', motDePasse); } catch (_) { /* stockage bloqué : sans gravité */ }
    montrer('choix');
  } catch (err) {
    $('erreur').textContent = err.message === 'fichier'
      ? 'Impossible de charger les maquettes. Vérifie la connexion.'
      : 'Mot de passe incorrect.';
  } finally {
    $('ouvrir').disabled = false;
    $('ouvrir').textContent = 'Ouvrir';
  }
});

async function afficher(maquette, bouton) {
  const texte = bouton.firstChild.textContent;
  bouton.firstChild.textContent = 'Ouverture…';
  try {
    const lot = await ouvrirFichier(maquette.fichier);
    $('titre').textContent = lot.nom;
    $('ecrans').replaceChildren(...lot.images.map((b64, i) => {
      const img = new Image();
      img.src = 'data:image/jpeg;base64,' + b64;
      img.alt = lot.nom + ', écran ' + (i + 1);
      return img;
    }));
    montrer('vue');
  } catch (_) {
    alert('Impossible d\'ouvrir cette maquette.');
  } finally {
    bouton.firstChild.textContent = texte;
  }
}

$('retour').addEventListener('click', () => montrer('choix'));

try {
  const memo = sessionStorage.getItem('mdp-maquettes');
  if (memo) { $('mdp').value = memo; $('formulaire').requestSubmit(); }
} catch (_) { /* stockage bloqué : on redemande le mot de passe */ }
</script>
</body>
</html>
